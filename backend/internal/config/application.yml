server:
  address: 127.0.0.1
  port: 8080

terminal:
  default-command: codex
  default-args: []
  default-workdir: .
  allowed-origins:
    - http://*
    - https://*
  detached-session-ttl-seconds: 3600
  ring-buffer-max-bytes: 4194304
  ring-buffer-max-chunks: 4096
  max-cols: 500
  max-rows: 200
  session-event-max-entries: 2048
  command-frame-max-entries: 256
  transcript-max-chars: 200000
  recent-sessions-file: data/recent-sessions.json
  recent-sessions-per-tool: 5
  cli-clients:
    - id: codex
      label: Codex
      command: codex
      args: []
      workdir: .
      env: {}
      shell: /bin/zsh
    - id: claude
      label: Claude Code
      command: claude
      args: []
      workdir: .
      env: {}
      shell: /bin/zsh
  agent:
    enabled: true
    step-timeout-seconds: 15
    max-step-result-chars: 8000
    max-context-pack-bytes: 262144
  ssh:
    enabled: true
    default-port: 22
    default-term: xterm-256color
    connect-timeout-millis: 10000
    connection-idle-ttl-seconds: 3600
    exec-default-timeout-seconds: 120
    exec-max-output-bytes: 1048576
    credentials-file: data/ssh-credentials.json
  files:
    enabled: false
    max-upload-file-bytes: 209715200
    max-upload-request-bytes: 524288000
    max-download-archive-bytes: 1073741824
    default-root-scope: SESSION_WORKDIR
    allow-outside-root: false
    allowed-roots: []
    download-ticket-ttl-seconds: 60

copilot:
  runner:
    base-url: ""
    timeout-seconds: 60
    authorization-bearer: ""
  agents:
    - key: default-assist
      label: Default Assist
      description: Built-in terminal suggestions powered by assist.
      type: builtin_assist
      default: true
      icon:
        name: sparkles
        color: "#2563EB"

assist:
  enabled: false
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api-key: ""
  model: ""
  timeout-seconds: 30
  max-screen-text-chars: 500
  debug-log: false
  system-prompt: ""

auth:
  enabled: false
  username: admin
  password-hash-bcrypt: ""
  session-ttl-seconds: 43200
  login-rate-limit-enabled: true
  login-rate-limit-window-seconds: 60
  login-rate-limit-max-attempts: 10

app-auth:
  enabled: false
  local-public-key-file: ""
  jwks-uri: ""
  issuer: ""
  jwks-cache-seconds: 300
  audience: ""
  clock-skew-seconds: 30
